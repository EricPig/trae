[project]
name = "xunwei-china"
version = "0.1.0"
description = "寻味中国 · 可核验的地方美食 AI 推荐平台"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Xunwei Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.1.0",
    "pgvector>=0.3.0",
    "openai>=1.50.0",
    "numpy>=2.1.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "alembic>=1.13.0",
    "factory-boy>=3.3.0",
]

[project.scripts]
xw-api = "src.api.main:app"
xw-worker = "src.analytics.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH", "RUF",
]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S308"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "slow: 慢测试",
]
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests", "scripts"]

[tool.coverage.run]
source = ["src"]
omit = ["src/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
