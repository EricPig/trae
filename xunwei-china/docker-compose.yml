# 寻味中国 · 开发/生产 docker-compose
#
# 用法:
#   开发（xunwei + postgres + redis）:
#     docker compose up -d
#
#   只用 SQLite 零依赖:
#     docker compose up -d xunwei
#
#   仅拉起数据层（前后端裸机跑）:
#     docker compose up -d postgres redis

services:
  xunwei:
    build: .
    container_name: xw-app
    environment:
      XW_ENV: ${ENVIRONMENT:-development}
      XW_PORT: "8765"
      XW_WORKERS: "${XW_WORKERS:-2}"
      # 如果启用了 postgres，取消注释:
      # POSTGRES_URL: postgresql+psycopg://xunwei:xunwei_dev@postgres:5432/xunwei
    ports:
      - "8765:8765"
    volumes:
      - xw-data:/app/data
      - xw-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: xw-postgres
    environment:
      POSTGRES_DB: xunwei
      POSTGRES_USER: xunwei
      POSTGRES_PASSWORD: xunwei_dev
    ports:
      - "5432:5432"
    volumes:
      - xw-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xunwei"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xw-redis
    ports:
      - "6379:6379"
    volumes:
      - xw-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  xw-data:       # SQLite DB
  xw-logs:       # 运行日志
  xw-pgdata:     # PostgreSQL
  xw-redisdata:  # Redis
