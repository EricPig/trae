# 寻味中国 · 本地开发环境
# T0 阶段最小化拓扑

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xw-postgres
    environment:
      POSTGRES_DB: xunwei
      POSTGRES_USER: xunwei
      POSTGRES_PASSWORD: xunwei_dev
    ports:
      - "5432:5432"
    volumes:
      - xw-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xunwei"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xw-redis
    ports:
      - "6379:6379"
    volumes:
      - xw-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  xw-pgdata:
  xw-redisdata:
